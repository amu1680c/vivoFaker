name: Build and Release VivoFaker

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, e.g. v1.0.1 (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK and generate SHA256
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are incomplete"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 2 -type f -name apksigner \
            | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK build-tools"
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/vivoFaker-signed.apk" \
            "$APK"

          mv "$RUNNER_TEMP/vivoFaker-signed.apk" \
            app/build/outputs/apk/release/vivoFaker.apk

          "$APKSIGNER" verify --verbose \
            app/build/outputs/apk/release/vivoFaker.apk

          cd app/build/outputs/apk/release

          sha256sum vivoFaker.apk > vivoFaker.apk.sha256

          echo "APK signing and SHA256 generation completed."
          cat vivoFaker.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: VivoFaker ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/vivoFaker.apk
            app/build/outputs/apk/release/vivoFaker.apk.sha256
          fail_on_unmatched_files: true
