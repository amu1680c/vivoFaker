
name: Build and Release VivoFaker

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, e.g. v1.0.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: vivofaker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-32
            build-tools;32.0.0

      - name: Setup JDK 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Prepare APK
        id: prepare
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi

          cp "$APK" dist/vivoFaker.apk

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/release.jks"

            BUILD_TOOLS="$ANDROID_HOME/build-tools/32.0.0"

            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out dist/vivoFaker-signed.apk \
              dist/vivoFaker.apk

            mv dist/vivoFaker-signed.apk dist/vivoFaker.apk

            "$BUILD_TOOLS/apksigner" verify \
              --verbose dist/vivoFaker.apk

            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No complete signing configuration; publishing unsigned APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          (cd dist && sha256sum vivoFaker.apk > vivoFaker.apk.sha256)

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivoFaker-${{ github.run_number }}
          path: |
            dist/vivoFaker.apk
            dist/vivoFaker.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name || format('build-{0}', github.run_number) }}
          name: VivoFaker ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: |
            ## VivoFaker

            Automated Android release build.

            - Package: `itao.vivofaker`
            - Min SDK: 21
            - Compile SDK: 32
            - APK signed: ${{ steps.prepare.outputs.signed }}

            SHA256 checksum is included.
          files: |
            dist/vivoFaker.apk
            dist/vivoFaker.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
